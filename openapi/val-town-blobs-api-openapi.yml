                      format: date-time
                  title: BlobListingItem
                description: List of blobs that you’ve stored
              example:
              - key: hello_world
                size: 20
                lastModified: '2024-06-24T20:00:59.702Z'
      summary: V2blobs list
      x-summary-source: derived
  /v2/blob/{key}:
    get:
      operationId: v2blobsGet
      tags:
      - Blobs
      description: Get a blob’s contents.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 512
        in: path
        name: key
        required: true
        description: Key that uniquely identifies this blob
      responses:
        '200':
          description: Binary contents of the returned file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      summary: V2blobs get
      x-summary-source: derived
    post:
      operationId: v2blobsStore
      tags:
      - Blobs
      description: Store data in blob storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
              description: Binary input data
        description: Binary input data
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 512
        in: path
        name: key
        required: true
        description: Key that uniquely identifies this blob
      security:
      - bearerAuth: []
      responses:
        '201':
