          content:
            application/json:
              schema:
                type: string
                enum:
                - ok
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                  message:
                    type: string
      summary: V2blobs store
      x-summary-source: derived
    delete:
      operationId: v2blobsDelete
      tags:
      - Blobs
      description: Delete a blob
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 512
        in: path
        name: key
        required: true
        description: Key that uniquely identifies this blob
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Blob successfully deleted
      summary: V2blobs delete
      x-summary-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Endpoints that support authorization expect Bearer authentication, using an API token provided from Val Town.
externalDocs:
  url: https://api.val.town/documentation
  description: Find more info here
